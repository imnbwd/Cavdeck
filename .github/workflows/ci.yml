name: Build & Test
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
jobs:
  build-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate PowerShell script syntax
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          foreach ($file in Get-ChildItem scripts -Filter '*.ps1' -File) {
            [System.Management.Automation.Language.Parser]::ParseFile(
              $file.FullName,
              [ref]$tokens,
              [ref]$errors
            ) | Out-Null
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error ($file.Name + ': ' + $_.Message) }
              exit 1
            }
          }
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Restore
        run: dotnet restore Cavdeck.sln
      - name: Build
        run: dotnet build Cavdeck.sln --no-restore -c Release
      - name: Unit tests
        run: dotnet test Cavdeck.sln --no-build -c Release
      - name: Install pinned Velopack CLI
        shell: pwsh
        run: dotnet tool install --global vpk --version 1.2.161
      - name: Package and verify unified Desktop + CLI installer
        shell: pwsh
        run: ./scripts/New-WindowsPackage.ps1 -Version 0.0.0 -SkipTests
      - name: Smoke test packaged CLI
        shell: pwsh
        run: |
          $cli = Join-Path $PWD 'artifacts/windows-package/0.0.0/publish/cli/cavdeck-cli.exe'
          & $cli --help
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI help failed' }
          $version = (& $cli --version | Out-String).Trim()
          if ($LASTEXITCODE -ne 0 -or ($version -split '\+', 2)[0] -ne '0.0.0') { throw 'Packaged CLI version mismatch' }
          $output = & $cli connection list --json
          if ($LASTEXITCODE -ne 0) { throw 'Packaged CLI connection list failed' }
          $result = $output | ConvertFrom-Json
          if ($result.schemaVersion -ne 1 -or $result.operation -ne 'connection.list' -or $null -eq $result.data.items) {
            throw 'Unexpected packaged CLI JSON'
          }
      - uses: actions/upload-artifact@v4
        with:
          name: cavdeck-windows-x64-unified-package
          path: artifacts/windows-package/0.0.0/Releases/
          if-no-files-found: error
      - name: Smoke test silent install and uninstall
        if: github.event_name == 'workflow_dispatch'
        shell: pwsh
        run: ./scripts/Test-WindowsInstall.ps1 -ReleasesDirectory artifacts/windows-package/0.0.0/Releases -Version 0.0.0 -DisposableMachine
      - name: Save installer smoke-test logs on failure
        if: failure() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cavdeck-win-x64-smoke-logs-${{ github.run_id }}
          path: artifacts/windows-package/0.0.0/smoke-logs/
          retention-days: 7
          if-no-files-found: ignore
      - name: Save installer for manual VM review
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: cavdeck-win-x64-installer-${{ github.run_id }}
          path: artifacts/windows-package/0.0.0/Releases/
          retention-days: 7
          if-no-files-found: error
