changelog:
  categories:
    - title: Features
      labels:
        - enhancement
        - feature
    - title: Improvements
      labels:
        - improvement
        - performance
        - ux
    - title: Bug Fixes
      labels:
        - bug
        - bugfix
    - title: Documentation
      labels:
        - documentation
        - docs
    - title: Dependencies
      labels:
        - dependencies
        - dependencies-update
    - title: Other Changes
      labels:
        - "*"
  exclude:
    labels:
      - skip-changelog
      - no-changelog
